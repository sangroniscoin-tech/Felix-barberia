name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # GitHub no siempre dispara el evento de pull_request: pasó en la PR #5, que
  # se quedó sin check ni reabriéndola. Sin esto no había forma de lanzarlo, y
  # el método no fusiona sin check verde.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No package-lock.json in this repository, so `npm ci` cannot be used.
      - run: npm install --no-audit --no-fund

      - run: npm run build
